ktor {
  deployment {
    sslPort = 2502
  }
  application {
    modules = [ com.helios.web.portfolio.ApplicationKt.module ]
  }

  security {
    ssl {
      keyStore = helios_portfolio.jks
      keyAlias = heliosAlias
      keyStorePassword = "local-dev-only"
      keyStorePassword = ${?KEYSTORE_PASSWORD}
      privateKeyPassword = "local-dev-only"
      privateKeyPassword = ${?KEY_PASSWORD}
    }
  }
}

storage {
  cv {
    directory = "storage/cv"
  }
}
site {
  # Public origin for canonical links, Open Graph tags and the sitemap.
  baseUrl = "https://phpduy.dev"
  baseUrl = ${?SITE_BASE_URL}
}
